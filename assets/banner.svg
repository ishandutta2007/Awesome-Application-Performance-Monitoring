<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1e38"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    
    /* Background Dynamic Waves / Pulsing Elements */
    @keyframes floatWave {
      0% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(-10px) scaleY(1.05); }
      100% { transform: translateY(0px) scaleY(1); }
    }
    @keyframes pulseParticle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.4); }
    }
    @keyframes dashTrace {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    .dynamic-bg-wave {
      animation: floatWave 6s ease-in-out infinite;
      transform-origin: center;
    }
    .p1 { animation: pulseParticle 3s ease-in-out infinite; }
    .p2 { animation: pulseParticle 4.5s ease-in-out infinite 1s; }
    .p3 { animation: pulseParticle 3.5s ease-in-out infinite 0.5s; }

    .trace-line {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: dashTrace 8s linear infinite;
    }
  </style>

  <!-- Base Layer: Dark Gradient Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Overlay -->
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- DYNAMIC BACKGROUND ELEMENTS (Kept in Background behind overlay text) -->
  <g class="dynamic-bg-wave" opacity="0.35">
    <!-- Simulated APM Performance Trace Graph Waves -->
    <path d="M -50 260 Q 150 180, 350 240 T 750 200 T 1150 230 T 1300 190 L 1300 350 L -50 350 Z" fill="none" stroke="url(#accentGrad)" stroke-width="3" filter="url(#glow)"/>
    <path d="M -50 280 Q 200 220, 450 270 T 850 210 T 1250 260 L 1250 350 L -50 350 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Glowing Dynamic Metric Nodes / Pulsing Signals in background right side -->
  <g stroke="none">
    <circle cx="850" cy="120" r="4" fill="#38bdf8" class="p1" filter="url(#softGlow)"/>
    <circle cx="980" cy="80" r="6" fill="#a855f7" class="p2" filter="url(#softGlow)"/>
    <circle cx="1060" cy="170" r="5" fill="#ec4899" class="p3" filter="url(#softGlow)"/>
    <circle cx="750" cy="220" r="4" fill="#34d399" class="p2" filter="url(#softGlow)"/>
  </g>

  <path class="trace-line" d="M 700 160 L 850 120 L 980 80 L 1060 170" fill="none" stroke="url(#lineGrad)" stroke-width="2" opacity="0.5"/>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, Pill -->
  <!-- Tag / Pill -->
  <g transform="translate(80, 60)">
    <rect width="240" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="15" r="4" fill="#38bdf8" filter="url(#softGlow)"/>
    <text x="30" y="20" class="badge-text">⚡ FULL-STACK OBSERVABILITY</text>
  </g>

  <!-- Title -->
  <text x="80" y="145" class="title">Awesome Application Performance Monitoring</text>

  <!-- Subtitle -->
  <text x="80" y="195" class="subtitle">Curated ecosystem of top APM tools, distributed tracing, continuous profiling &amp; metrics</text>

  <!-- Feature Highlights Bar -->
  <g transform="translate(80, 235)">
    <!-- Stat 1 -->
    <text x="0" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#6366f1">● SaaS &amp; Open-Source</text>
    <!-- Stat 2 -->
    <text x="210" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#a855f7">● OpenTelemetry Native</text>
    <!-- Stat 3 -->
    <text x="430" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#ec4899">● Real-time Metrics &amp; Traces</text>
  </g>

  <!-- Accent Bottom Border Line -->
  <rect x="0" y="314" width="1200" height="6" fill="url(#accentGrad)"/>
</svg>
